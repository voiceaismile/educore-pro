<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduCore Pro - Modern School Management System</title>
  <meta name="description" content="Offline-first School Management ERP with Firebase Realtime Database & Firestore cloud backup. White-label ready.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.json">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=3.4">
</head>
<body>

  <!-- Main Application Wrapper -->
  <div id="app">
    
    <!-- Left Navigation Sidebar -->
    <aside class="sidebar" id="sidebar">
      <!-- School Brand Header -->
      <div class="brand-section">
        <div class="brand-logo-badge brand-logo-text">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div class="brand-info">
          <h2 class="brand-title brand-name-text">School Portal</h2>
          <span class="brand-subtitle">School Portal</span>
        </div>
      </div>

      <!-- Dynamic Navigation Menu -->
      <nav class="nav-menu" id="sidebarNavMenu">
        <!-- Rendered dynamically by app.js based on role -->
      </nav>

      <!-- Sidebar Footer (Sync Indicator) -->
      <div class="sidebar-footer">
        <div class="sync-status-card">
          <div class="sync-indicator">
            <span class="status-dot offline" id="syncStatusDot"></span>
            <span id="syncStatusText" style="font-weight:600;">Checking sync...</span>
          </div>
          <button class="btn-quick-sync" id="btnQuickSync" title="Sync Pending Changes with Cloud">
            <i class="fa-solid fa-arrows-rotate"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- Right Main Wrapper -->
    <div class="main-wrapper">
      
      <!-- Top Application Header -->
      <header class="app-header">
        <div class="header-left">
          <button class="menu-toggle-btn" id="menuToggleBtn" title="Toggle Navigation">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="header-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="globalSearchInput" placeholder="Quick search scholars, staff, classes...">
          </div>
        </div>

        <div class="header-right">
          <!-- Cloud / Offline Status Pill -->
          <div class="system-badge-pill" id="headerSyncPill">
            <span class="status-dot offline"></span>
            <span>Offline Ready</span>
          </div>

          <!-- Theme Dark/Light Toggle -->
          <button class="icon-action-btn" id="themeToggleBtn" title="Toggle Dark / Light Mode">
            <i class="fa-solid fa-sun"></i>
          </button>

          <!-- v3.0 Language Toggle (EN / اردو) -->

          <!-- User Profile Display -->
          <div class="user-profile-widget" id="userProfileWidget">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=admin" class="user-avatar" id="headerUserAvatar" alt="User Avatar">
            <div class="user-details">
              <span class="user-name" id="headerUserName">Administrator</span>
              <span class="user-role-badge" id="headerUserRole">ADMIN</span>
            </div>
          </div>
        </div>
      </header>

      <!-- Dynamic Main Content Area -->
      <main class="content-body" id="mainContentArea">
        <!-- Views rendered dynamically by app.js -->
      </main>

    </div>

  </div>

  <!-- Public College / School Landing Page (Visitors & Online Admissions) -->
  <div id="publicLandingPage" class="landing-page-root" style="display:none;"></div>

  <!-- Auth Modal Overlay (Login, Teacher Register, Student Register) -->
  <div id="authModalWrapper" class="auth-wrapper" style="display:none;">
    <div id="authModalInner"></div>
  </div>

  <!-- Main ES Module Script -->
  <script type="module" src="js/app.js?v=3.4"></script>

</body>
</html>
